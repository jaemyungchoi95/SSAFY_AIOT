# my_cartographer/config/nav2_params.yaml
# 자동차형 로봇의 자율 탐색 및 주행을 위한 설정 파일

# 위치 추정(AMCL)은 SLAM 모드에서는 사용되지 않지만, 나중에 저장된 맵으로 주행할 때를 위해 남겨둡니다.
amcl:
  ros__parameters:
    use_map_topic: true
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    global_frame_id: "map"
    scan_topic: /scan
    min_particles: 500
    max_particles: 2000

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom # Cartographer가 이 토픽을 발행합니다.
    bt_loop_duration: 10
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

# ===== ★★★★★ 자동차형 로봇을 위한 핵심 설정 ★★★★★ =====
planner_server:
  ros__parameters:
    use_sim_time: False
    # 경로 계획 플러그인 설정
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid" # 자동차 방식에 적합한 플래너
      allow_unknown: true             # 아직 모르는 영역으로도 길을 찾도록 허용
      max_planning_time: 5.0          # 계획 시간 (초)
      min_turning_radius: 0.4         # [중요!] 로봇의 실제 최소 회전 반경(m)으로 수정하세요!
      reverse_penalty: 2.0            # 후진을 피하려는 정도 (값이 클수록 후진을 덜 함)
      
controller_server:
  ros__parameters:
    use_sim_time: False
    # 주행 제어 플러그인 설정
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController" # 자동차 방식에 적합한 컨트롤러
      lookahead_dist: 0.6             # 경로를 따라갈 때 몇 미터 앞을 볼 것인지
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.1

# ==================================================================

# 비용맵 (장애물 지도) 설정
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      # [중요!] 로봇의 실제 크기(m)에 맞게 수정! 예: 길이 0.4m, 폭 0.3m
      footprint: "[[0.2, 0.15], [-0.2, 0.15], [-0.2, -0.15], [0.2, -0.15]]" 
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35 # 로봇이 벽에서 떨어져야 할 최소 거리
      always_send_full_costmap: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # [중요!] 로봇의 실제 크기(m)에 맞게 수정!
      footprint: "[[0.2, 0.15], [-0.2, 0.15], [-0.2, -0.15], [0.2, -0.15]]" 
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: True

# 나머지 서버들은 기본값 사용
behavior_server:
  ros__parameters:
    use_sim_time: False

smoother_server:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False

# 자율 탐색 노드 설정
explore_lite:
  ros__parameters:
    use_sim_time: False
    planner_name: "GridBased"
    controller_name: "FollowPath"
    goal_topic: "/goal_pose"
    robot_base_frame: "base_link"
    costmap_topic: "/global_costmap/costmap"
    costmap_updates_topic: "/global_costmap/costmap_updates"
    visualize: True
    potential_scale: 3.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.5
    min_frontier_size: 0.5
